name: Notebook diff

# Runs on every PR (no paths filter) so the required check always reports,
# even on PRs that don't touch notebooks.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: notebook-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REVIEW_DONE_LABEL: notebook-review-done
  INCLUDE_OUTPUTS: "false"   # outputs are noisy and may contain data samples

jobs:
  notebook-diff:
    # Make this job name a required status check in branch protection.
    name: Notebook diff removed
    runs-on: ubuntu-latest
    env:
      IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.NOTEBOOK_DIFF_TOKEN || github.token }}

      - name: Generate, update, or remove notebook diff
        if: env.IS_FORK == 'false'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          REVIEW_DONE: ${{ contains(github.event.pull_request.labels.*.name, env.REVIEW_DONE_LABEL) }}
        run: python3 .github/scripts/notebook_diff.py

      - name: Commit and push if changed
        if: env.IS_FORK == 'false'
        run: |
          if [ -z "$(git status --porcelain -- .notebook-diffs)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .notebook-diffs
          git commit -m "Update notebook review diff"
          git push origin "HEAD:$HEAD_REF"

      - name: Block merge while the review file exists
        run: |
          if [ -d .notebook-diffs ] && [ -n "$(ls -A .notebook-diffs)" ]; then
            echo "::error::The notebook review file is still in this PR. When review is done, add the '$REVIEW_DONE_LABEL' label and it will be removed automatically."
            exit 1
          fi
          echo "No notebook review file present."
